<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prediction Markets AI</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:#090d12; --bg2:#0f1419; --bg3:#161c24; --bg4:#1d2630;
    --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.13);
    --accent:#00e5a0; --accent2:#00b87a; --accent-dim:rgba(0,229,160,0.12);
    --red:#ff4d6d; --red-dim:rgba(255,77,109,0.12);
    --amber:#f0a500; --amber-dim:rgba(240,165,0,0.12);
    --text:#dde2e8; --text2:#7d8896; --text3:#3d4754;
    --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans',sans-serif; --radius:10px;
  }
  html,body { height:100%; background:var(--bg); color:var(--text); font-family:var(--sans); font-size:14px; line-height:1.6; overflow:hidden; }
  #app { display:flex; flex-direction:column; height:100vh; }
  #header { display:flex; align-items:center; justify-content:space-between; padding:11px 16px; background:var(--bg2); border-bottom:1px solid var(--border); flex-shrink:0; }
  .header-left { display:flex; align-items:center; gap:10px; }
  .logo-box { width:30px; height:30px; background:var(--accent); border-radius:7px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .header-title { font-family:var(--mono); font-size:12px; font-weight:500; letter-spacing:0.08em; color:var(--text); }
  .header-sub { font-family:var(--mono); font-size:10px; color:var(--text3); letter-spacing:0.06em; margin-top:1px; }
  .live-badge { display:flex; align-items:center; gap:5px; font-family:var(--mono); font-size:10px; color:var(--accent2); letter-spacing:0.06em; }
  .live-dot { width:5px; height:5px; background:var(--accent); border-radius:50%; animation:livepulse 2s ease-in-out infinite; }
  @keyframes livepulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.3;transform:scale(0.7)} }
  #messages { flex:1; overflow-y:auto; padding:18px 16px; display:flex; flex-direction:column; gap:18px; scroll-behavior:smooth; }
  #messages::-webkit-scrollbar { width:3px; }
  #messages::-webkit-scrollbar-thumb { background:var(--border2); border-radius:2px; }
  #welcome { display:flex; flex-direction:column; align-items:center; justify-content:center; flex:1; gap:18px; padding:20px 16px; text-align:center; animation:fadeUp 0.4s ease; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
  .welcome-icon { width:52px; height:52px; background:var(--bg3); border:1px solid var(--border2); border-radius:14px; display:flex; align-items:center; justify-content:center; }
  .welcome-title { font-family:var(--mono); font-size:14px; font-weight:500; color:var(--text); letter-spacing:0.06em; }
  .welcome-sub { font-size:12px; color:var(--text2); max-width:300px; line-height:1.7; margin-top:6px; }
  .suggestions { display:flex; flex-direction:column; gap:7px; width:100%; max-width:420px; }
  .sug-btn { background:var(--bg3); border:1px solid var(--border); border-radius:8px; padding:9px 13px; color:var(--text2); font-size:11px; font-family:var(--mono); cursor:pointer; text-align:left; transition:border-color 0.15s,color 0.15s,background 0.15s; line-height:1.5; }
  .sug-btn:hover { border-color:rgba(0,229,160,0.4); color:var(--accent); background:var(--accent-dim); }
  .msg { display:flex; gap:10px; animation:fadeUp 0.18s ease; }
  .msg.user { flex-direction:row-reverse; }
  .avatar { width:26px; height:26px; border-radius:6px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-size:9px; font-weight:500; letter-spacing:0.04em; }
  .msg.user .avatar { background:var(--accent-dim); color:var(--accent); border:1px solid rgba(0,229,160,0.25); }
  .msg.bot .avatar { background:var(--bg3); color:var(--text2); border:1px solid var(--border); }
  .bubble { max-width:calc(100% - 80px); padding:10px 14px; font-size:13px; line-height:1.65; border-radius:var(--radius); }
  .msg.user .bubble { background:var(--accent-dim); border:1px solid rgba(0,229,160,0.18); color:var(--text); border-radius:var(--radius) 3px var(--radius) var(--radius); }
  .msg.bot .bubble { background:var(--bg2); border:1px solid var(--border); color:var(--text); border-radius:3px var(--radius) var(--radius) var(--radius); width:100%; }
  .msg.bot .bubble h3 { font-family:var(--mono); font-size:10px; font-weight:500; letter-spacing:0.1em; text-transform:uppercase; color:var(--text3); margin:14px 0 8px; padding-bottom:7px; border-bottom:1px solid var(--border); }
  .msg.bot .bubble h3:first-child { margin-top:2px; }
  .msg.bot .bubble .market-card { background:var(--bg3); border:1px solid var(--border); border-radius:8px; padding:11px 13px; margin:6px 0; transition:border-color 0.15s; }
  .msg.bot .bubble .market-card:hover { border-color:var(--border2); }
  .msg.bot .bubble .market-title { font-size:12px; font-weight:500; color:var(--text); line-height:1.45; margin-bottom:8px; }
  .msg.bot .bubble .market-meta { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .msg.bot .bubble .prob { font-family:var(--mono); font-size:17px; font-weight:500; }
  .msg.bot .bubble .prob.high { color:var(--accent); }
  .msg.bot .bubble .prob.mid  { color:var(--amber); }
  .msg.bot .bubble .prob.low  { color:var(--red); }
  .msg.bot .bubble .tag { font-family:var(--mono); font-size:9px; letter-spacing:0.07em; padding:2px 7px; border-radius:4px; background:var(--bg4); color:var(--text2); border:1px solid var(--border); }
  .msg.bot .bubble .vol { font-family:var(--mono); font-size:11px; color:var(--text3); margin-left:auto; }
  .msg.bot .bubble .market-outcome { font-size:11px; color:var(--text2); margin-top:6px; font-style:italic; }
  .msg.bot .bubble .change { font-family:var(--mono); font-size:11px; font-weight:500; padding:1px 6px; border-radius:4px; }
  .msg.bot .bubble .change.up   { color:var(--accent); background:var(--accent-dim); }
  .msg.bot .bubble .change.down { color:var(--red);    background:var(--red-dim); }
  .msg.bot .bubble p { font-size:13px; color:var(--text2); line-height:1.65; margin:6px 0; }
  .msg.bot .bubble strong { color:var(--text); font-weight:500; }
  .msg.bot .bubble .highlight { color:var(--accent); font-family:var(--mono); }
  .msg.bot .bubble ul { list-style:none; padding:0; margin:8px 0; }
  .msg.bot .bubble li { font-size:13px; color:var(--text2); padding:3px 0 3px 14px; position:relative; }
  .msg.bot .bubble li::before { content:'›'; position:absolute; left:0; color:var(--accent); font-weight:500; }
  .error-msg { font-size:12px; color:var(--red); font-family:var(--mono); padding:8px 12px; background:var(--red-dim); border:1px solid rgba(255,77,109,0.2); border-radius:6px; }
  .typing { display:flex; gap:4px; align-items:center; padding:4px 2px; }
  .typing span { width:5px; height:5px; background:var(--text3); border-radius:50%; animation:bounce 1.1s infinite; }
  .typing span:nth-child(2) { animation-delay:0.18s; }
  .typing span:nth-child(3) { animation-delay:0.36s; }
  @keyframes bounce { 0%,60%,100%{transform:translateY(0);opacity:0.4} 30%{transform:translateY(-5px);opacity:1} }
  #input-area { padding:12px 16px 14px; background:var(--bg2); border-top:1px solid var(--border); flex-shrink:0; }
  #input-wrap { display:flex; align-items:flex-end; gap:8px; background:var(--bg3); border:1px solid var(--border2); border-radius:var(--radius); padding:8px 8px 8px 14px; transition:border-color 0.15s; }
  #input-wrap:focus-within { border-color:rgba(0,229,160,0.35); }
  #chat-input { flex:1; background:transparent; border:none; outline:none; color:var(--text); font-family:var(--sans); font-size:13px; resize:none; min-height:20px; max-height:100px; line-height:1.55; padding:2px 0; }
  #chat-input::placeholder { color:var(--text3); }
  #send { width:32px; height:32px; background:var(--accent); border:none; border-radius:7px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:background 0.15s,transform 0.1s; }
  #send:hover:not(:disabled) { background:var(--accent2); }
  #send:active:not(:disabled) { transform:scale(0.94); }
  #send:disabled { background:var(--bg4); cursor:not-allowed; }
  #footer { margin-top:8px; text-align:center; font-family:var(--mono); font-size:10px; color:var(--text3); letter-spacing:0.04em; }
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div class="header-left">
      <div class="logo-box">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <polyline points="1,12 5,5 9,9 13,4" stroke="#090d12" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="13" cy="4" r="1.8" fill="#090d12"/>
        </svg>
      </div>
      <div>
        <div class="header-title">PREDICTION MARKETS AI</div>
        <div class="header-sub">POLYMARKET · KALSHI · DFLOW</div>
      </div>
    </div>
    <div class="live-badge"><div class="live-dot"></div>LIVE</div>
  </div>

  <div id="messages">
    <div id="welcome">
      <div class="welcome-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <polyline points="2,18 7,9 13,14 18,7" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="18" cy="7" r="2.2" fill="var(--accent)" opacity="0.8"/>
          <line x1="2" y1="21" x2="22" y2="21" stroke="var(--border2)" stroke-width="1"/>
        </svg>
      </div>
      <div>
        <div class="welcome-title">MARKET INTELLIGENCE</div>
        <div class="welcome-sub">Ask anything about prediction market odds, probability shifts, volume trends, or specific events across Polymarket, Kalshi, and more.</div>
      </div>
      <div class="suggestions">
        <button class="sug-btn" onclick="useSuggestion(this)">› Top US election markets by volume right now</button>
        <button class="sug-btn" onclick="useSuggestion(this)">› Show pricing history for the next Fed rate decision</button>
        <button class="sug-btn" onclick="useSuggestion(this)">› Which markets have seen the biggest probability shifts this week?</button>
        <button class="sug-btn" onclick="useSuggestion(this)">› Top 10 crypto markets on Polymarket right now</button>
      </div>
    </div>
  </div>

  <div id="input-area">
    <div id="input-wrap">
      <textarea id="chat-input" placeholder="Ask about any prediction market..." rows="1"></textarea>
      <button id="send" title="Send" onclick="send()">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <line x1="7" y1="12" x2="7" y2="2" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
          <polyline points="3,6 7,2 11,6" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
    <div id="footer">powered by predexon · live market data</div>
  </div>
</div>
<script>
  const BACKEND_URL = 'https://api.dataopenmind.com/public/predexon-chat';

  let history = [
    {
        role: "user",
        content: "What is today's date and are you ready to query live market data?"
    },
    {
        role: "assistant",
        content: `Today is ${today}. I am ready to query live market data from both the OMD and Predexon APIs for all requests. I will never use training data for market prices or odds.`
    }
];
  let busy    = false;

  const messagesEl = document.getElementById('messages');
  const welcomeEl  = document.getElementById('welcome');
  const inputEl    = document.getElementById('chat-input');
  const sendBtn    = document.getElementById('send');

  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });

  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 100) + 'px';
  });

  function useSuggestion(btn) {
    inputEl.value = btn.textContent.replace(/^›\s*/, '').trim();
    send();
  }

  function hideWelcome() { if (welcomeEl) welcomeEl.style.display = 'none'; }
  function scrollBottom() { messagesEl.scrollTop = messagesEl.scrollHeight; }

  function escapeHTML(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function isHTML(str) { return /<[a-z][\s\S]*>/i.test(str); }

  function addUserMsg(text) {
    hideWelcome();
    const row = document.createElement('div');
    row.className = 'msg user';
    row.innerHTML = `<div class="avatar">YOU</div><div class="bubble">${escapeHTML(text)}</div>`;
    messagesEl.appendChild(row);
    scrollBottom();
  }

  function addTyping() {
    hideWelcome();
    const row = document.createElement('div');
    row.className = 'msg bot';
    row.id = 'typing-row';
    row.innerHTML = `<div class="avatar">AI</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
    messagesEl.appendChild(row);
    scrollBottom();
  }

  function removeTyping() {
    const el = document.getElementById('typing-row');
    if (el) el.remove();
  }

  function addBotMsg(html) {
    const row = document.createElement('div');
    row.className = 'msg bot';
    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = 'AI';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = isHTML(html) ? html : `<p>${escapeHTML(html)}</p>`;
    row.appendChild(avatar);
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    scrollBottom();
  }

  function addErrorMsg(msg) {
    const row = document.createElement('div');
    row.className = 'msg bot';
    row.innerHTML = `<div class="avatar">AI</div><div class="bubble"><div class="error-msg">${escapeHTML(msg)}</div></div>`;
    messagesEl.appendChild(row);
    scrollBottom();
  }

  function setLoading(val) { busy = val; sendBtn.disabled = val; }

  async function send() {
    const text = inputEl.value.trim();
    if (!text || busy) return;

    setLoading(true);
    inputEl.value = '';
    inputEl.style.height = 'auto';
    addUserMsg(text);
    addTyping();

    try {
      const res = await fetch(BACKEND_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, history: history })
      });

      removeTyping();

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        addErrorMsg(`Error ${res.status}: ${err.detail || 'Something went wrong. Please try again.'}`);
        return;
      }

      const data = await res.json();
      history = data.history;
      addBotMsg(data.reply);

    } catch (err) {
      removeTyping();
      addErrorMsg('Could not reach the server. Please try again.');
      console.error(err);
    } finally {
      setLoading(false);
      inputEl.focus();
    }
  }
</script>
</body>
</html>
